# xdg-desktop-portal-hyprland. Read once at portal startup: after changing it,
# `systemctl --user restart xdg-desktop-portal-hyprland`.
screencopy {
    # Screen Cast launcher (quickshell): answers with the source picked in the
    # launcher, or opens hyprland-share-picker for any other share.
    custom_picker_binary = quickshell-share-picker
}
