# Idle daemon for Hyprland. hypridle.service is enabled by the NixOS
# `programs.hyprlock` module. There are deliberately no idle listeners here:
# this file only makes the session lock when the machine goes to sleep, so it
# never resumes without authentication. Add `listener { }` blocks if idle
# timeouts are ever wanted.

general {
    lock_cmd = pidof hyprlock || hyprlock            # don't spawn a second lock screen
    before_sleep_cmd = loginctl lock-session         # lock before suspend
    after_sleep_cmd = sleep 1 && hyprctl dispatch dpms on
}
