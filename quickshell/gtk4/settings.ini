# GTK4 global settings — deployed as ~/.config/gtk-4.0 via out-of-store symlink
# (nixos/programs/quickshell.nix). Read at app startup by every GTK4 app.
#
# Caret parity with the quickshell launchers' cursorDelegate (KeyLauncher):
# static block bar instead of the blinking thin line.
#   cursorDelegate: 6px x 1.5em at 13-14px font  ->  width ~= 0.3 x caret height
[Settings]
gtk-cursor-blink = false
gtk-cursor-aspect-ratio = 0.3
